version: '3.8'

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - patorbit
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

services:
  # ── Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pks_postgres
    <<: *app-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-patorbit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pks_redis
    <<: *app-defaults
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-07-20T00-09-51Z
    container_name: pks_minio
    <<: *app-defaults
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ── API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    image: ghcr.io/patorbit/pks-api:${RELEASE_TAG:-latest}
    container_name: pks_api
    <<: *app-defaults
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Web (Next.js) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    image: ghcr.io/patorbit/pks-web:${RELEASE_TAG:-latest}
    container_name: pks_web
    <<: *app-defaults
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

  # ── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pks_nginx
    <<: *app-defaults
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
      - web

  # ── Certbot (SSL) ──────────────────────────────────
  certbot:
    image: certbot/certbot:v2.10.0
    container_name: pks_certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./infra/nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_data:

networks:
  patorbit:
    name: patorbit
    driver: bridge
