# ── HTTP → HTTPS redirect ──
server {
  listen 80;
  listen [::]:80;
  server_name beta.patorbit.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS server ──
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name beta.patorbit.com;

  # ── SSL ──
  ssl_certificate     /etc/nginx/ssl/live/beta.patorbit.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/beta.patorbit.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # ── Security headers (HTTPS only) ──
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # ── Root for certbot ──
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # ── API proxy ──
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # ── CORS headers ──
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # ── Web app ──
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }
}
