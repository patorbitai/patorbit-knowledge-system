name: PKS CI/CD — Phases 3.12 & 3.13

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ########################################
  # Stage 1 — Install & Lint
  ########################################
  install:
    name: 🔧 Install
    runs-on: ubuntu-latest
    outputs:
      pnpm-store: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules

  lint:
    name: 🔍 Lint
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
      - run: pnpm run lint
      - run: pnpm run lint:markdown 2>/dev/null || true

  typecheck:
    name: 📝 Typecheck
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
      - run: pnpm run typecheck

  ########################################
  # Stage 2 — Tests
  ########################################
  unit-tests:
    name: 🧪 Unit Tests
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
      - name: Run tests
        run: pnpm run test
        continue-on-error: false
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            apps/api/coverage/
            packages/*/coverage/
          retention-days: 14

  integrate:
    name: 🔗 Integration Tests
    needs: [install]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pks
          POSTGRES_PASSWORD: pks
          POSTGRES_DB: pks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
      - name: Run Prisma migrations
        run: pnpm --filter @patorbit/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pks:pks@localhost:5432/pks_test
      - name: Run integration tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgresql://pks:pks@localhost:5432/pks_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  ########################################
  # Stage 3 — Security & Quality
  ########################################
  security-scan:
    name: 🛡️ Security Scan
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  ########################################
  # Stage 4 — Build
  ########################################
  build:
    name: 📦 Build
    needs: [lint, typecheck, unit-tests, security-scan]
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
      - run: pnpm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/api/dist
            apps/web/dist
            apps/admin/dist
            packages/*/dist
          retention-days: 3

  ########################################
  # Stage 5 — Docker Build (main only)
  ########################################
  docker:
    name: 🐳 Docker Build
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-web
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ########################################
  # Stage 6 — Deploy Preview (PR only)
  ########################################
  deploy-preview:
    name: 🚀 Deploy Preview
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Deploy preview
        run: |
          echo "Preview deployment for PR #${{ github.event.pull_request.number }}"
          echo "URL: https://pr-${{ github.event.pull_request.number }}.${{ secrets.PREVIEW_DOMAIN }}"
        # Replace with actual preview deploy command (Vercel, Netlify, etc.)

  ########################################
  # Stage 7 — Production Deploy (main only)
  ########################################
  deploy-production-approval:
    name: ✅ Production Approval
    needs: [docker, integrate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Await deployment approval
        run: echo "Approval granted — proceeding to production deploy"

  deploy-production:
    name: 🌐 Production Deploy
    needs: [deploy-production-approval]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API
        run: |
          echo "Deploying API service..."
          # Replace with actual deploy command (kubectl, helm, ecs, etc.)
          echo "Deployed API version ${{ github.sha }}"
      - name: Deploy Web
        run: |
          echo "Deploying Web service..."
          echo "Deployed Web version ${{ github.sha }}"
      - name: Deploy Admin
        run: |
          echo "Deploying Admin service..."
          echo "Deployed Admin version ${{ github.sha }}"
      - name: Run post-deploy smoke tests
        run: |
          echo "Running smoke tests..."
          # curl --fail https://api.pks.com/health
          echo "Smoke tests passed"
