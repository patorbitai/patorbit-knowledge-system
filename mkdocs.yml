site_name: Patorbit Knowledge System
site_url: https://patorbitai.github.io/patorbit-knowledge-system/
repo_url: https://github.com/patorbitai/patorbit-knowledge-system
repo_name: patorbitai/patorbit-knowledge-system
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Books:
      - 'Volume 0: Canon':
          - 'Book I: Foundation':
              - 'Overview': books/volume-0-canon/book-1-foundation/index.md
              - 'Chapter 1: Identity of Patorbit': books/volume-0-canon/book-1-foundation/chapters/chapter-1-identity-of-patorbit.md
              - 'Chapter 2: Knowledge Philosophy': books/volume-0-canon/book-1-foundation/chapters/chapter-2-knowledge-philosophy.md
              - 'Chapter 3: Core Domain Model': books/volume-0-canon/book-1-foundation/chapters/chapter-3-core-domain-model.md
              - 'Chapter 4: Knowledge Architecture': books/volume-0-canon/book-1-foundation/chapters/chapter-4-knowledge-architecture.md
              - 'Chapter 5: Governance': books/volume-0-canon/book-1-foundation/chapters/chapter-5-governance.md
  - Architecture Decisions:
      - 'ADR Log': adr/index.md
      - 'ADR 1: Use Markdown for All Docs': adr/0001-use-markdown-for-all-docs.md
  - Standards:
      - 'Overview': standards/index.md
      - 'Documentation Conventions': standards/documentation-conventions.md
      - 'Markdown Conventions': standards/markdown-conventions.md
      - 'Naming Conventions': standards/naming-conventions.md
      - 'Metadata Conventions': standards/metadata-conventions.md
      - 'Versioning Conventions': standards/versioning-conventions.md
  - Specifications: specifications/index.md
  - Glossary: glossary/index.md
  - Changelog: CHANGELOG.md
  - Roadmap: ROADMAP.md
  - Contributing: CONTRIBUTING.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
